<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>letemcook</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #2a0e0e 0%, #3d1818 40%, #4a1f1a 100%);
      --primary-rgb: 212, 160, 78;
      --accent-rgb: 220, 60, 30;
      --checked-rgb: 126, 232, 162;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      padding: 32px 20px 80px;
      color: #f5e1b4;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 760px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 880px;
      }

      body {
        padding: 48px 40px 80px;
      }
    }

    /* Toggle */
    .toggle-container {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(var(--primary-rgb), 0.15);
      border-radius: 12px;
      padding: 5px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: rgba(245,225,180,0.55);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, rgb(var(--primary-rgb)) 0%, rgb(var(--accent-rgb)) 100%);
      color: #1a0808;
    }

    .toggle-btn:hover:not(.active) {
      background: rgba(255,255,255,0.05);
      color: #f5e1b4;
    }

    /* Sections */
    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    /* Header */
    .week-label {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgb(var(--primary-rgb));
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.05;
      color: #f5e1b4;
      font-style: italic;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(245,225,180,0.55);
      letter-spacing: 0.3px;
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    /* Progress */
    .progress-track {
      height: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid rgba(var(--primary-rgb), 0.15);
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, rgb(var(--primary-rgb)) 0%, rgb(var(--accent-rgb)) 100%);
      transition: width 0.3s ease;
      border-radius: 100px;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: rgba(245,225,180,0.5);
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* Categories */
    .category {
      margin-bottom: 28px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(var(--primary-rgb), 0.15);
    }

    .category-emoji {
      font-size: 22px;
    }

    .category-title {
      font-family: Georgia, 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 500;
      color: #f5e1b4;
      letter-spacing: 0.3px;
    }

    /* Grocery Item */
    .grocery-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(var(--primary-rgb), 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 14px;
    }

    .grocery-item:hover {
      background: rgba(0,0,0,0.35);
    }

    .grocery-item.checked {
      background: rgba(var(--checked-rgb), 0.05);
      border-color: rgba(var(--checked-rgb), 0.25);
    }

    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex: 1;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid rgba(245,225,180,0.3);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s ease;
    }

    .grocery-item.checked .checkbox {
      background: rgb(var(--checked-rgb));
      border-color: rgb(var(--checked-rgb));
    }

    .checkmark {
      color: #1a0808;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      display: none;
    }

    .grocery-item.checked .checkmark {
      display: block;
    }

    .item-name {
      font-size: 15px;
      font-weight: 500;
      color: #f5e1b4;
      line-height: 1.4;
      transition: all 0.2s ease;
      margin-bottom: 3px;
    }

    .grocery-item.checked .item-name {
      color: rgba(245,225,180,0.4);
      text-decoration: line-through;
    }

    .item-note {
      font-size: 12px;
      color: rgba(245,225,180,0.45);
      font-style: italic;
      line-height: 1.4;
    }

    .quantity-badge {
      background: rgba(var(--primary-rgb), 0.14);
      color: rgb(var(--primary-rgb));
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s ease;
    }

    .grocery-item.checked .quantity-badge {
      background: rgba(var(--checked-rgb), 0.12);
      color: rgb(var(--checked-rgb));
    }

    .footer-note {
      color: rgba(245,225,180,0.18);
      font-size: 11px;
      text-align: center;
      margin-top: 28px;
      letter-spacing: 0.3px;
    }

    /* Recipe */
    .recipe-content {
      color: #f5e1b4;
      line-height: 1.8;
    }

    .recipe-content h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      color: #f5e1b4;
      margin: 0 0 6px 0;
      font-weight: 600;
      font-style: italic;
      text-align: center;
      border-bottom: none;
    }

    /* "Week of June 9, 2026" — the h2 immediately after the h1 */
    .recipe-content h1 + h2 {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgb(var(--primary-rgb));
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-style: normal;
      text-align: center;
      border-bottom: none;
      margin: 0 0 24px 0;
    }

    .recipe-content h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      color: #f5e1b4;
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(var(--primary-rgb), 0.2);
      font-weight: 600;
    }

    .recipe-content h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      color: #f5e1b4;
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(var(--primary-rgb), 0.2);
      font-weight: 600;
    }

    .recipe-content h4 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      color: rgb(var(--primary-rgb));
      margin: 20px 0 10px 0;
      font-weight: 600;
      font-style: italic;
    }

    .recipe-content p {
      margin: 12px 0;
      color: rgba(245,225,180,0.85);
    }

    .recipe-content ul, .recipe-content ol {
      margin: 12px 0;
      padding-left: 20px;
      color: rgba(245,225,180,0.85);
    }

    .recipe-content li {
      margin: 8px 0;
    }

    .recipe-content strong {
      color: #f5e1b4;
      font-weight: 600;
    }

    .recipe-content em {
      color: rgba(245,225,180,0.65);
    }

    .recipe-content blockquote {
      background: rgba(var(--primary-rgb), 0.06);
      border-left: 3px solid rgb(var(--primary-rgb));
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      padding: 12px 16px;
      font-style: italic;
    }

    .recipe-content blockquote p {
      margin: 0;
      color: rgba(245,225,180,0.75);
    }

    .recipe-content a {
      color: rgb(var(--primary-rgb));
      text-decoration: underline;
      text-decoration-color: rgba(var(--primary-rgb), 0.4);
    }

    hr {
      border: none;
      border-top: 1px solid rgba(var(--primary-rgb), 0.15);
      margin: 28px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px 60px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Toggle Buttons -->
    <div class="toggle-container">
      <button class="toggle-btn active" onclick="showSection('grocery', this)">
        Grocery List
      </button>
      <button class="toggle-btn" onclick="showSection('recipe', this)">
        Recipe
      </button>
    </div>

    <!-- Grocery List Section -->
    <div id="grocery-section" class="content-section active">
      <div class="header">
        <div id="week-label" class="week-label"></div>
        <h1 style="font-style: normal; font-weight: 400; font-family: Georgia, 'Times New Roman', serif;">Grocery List</h1>
        <div id="meal-subtitle" class="subtitle" style="font-style: italic; margin-top: 10px;"></div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progress-count">0 of 0 items collected</div>

      <div id="grocery-list"></div>

      <p class="footer-note">Tap items to check off while shopping</p>
    </div>

    <!-- Recipe Section -->
    <div id="recipe-section" class="content-section">
      <div id="recipe-content" class="recipe-content"></div>
    </div>
  </div>

  <script>
    let currentWeek = null;
    let checkedItems = {};
    let groceryCategories = [];

    function resolveWeek() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('week')) return params.get('week');

      const now = new Date();
      const daysFromMonday = now.getDay() === 0 ? 6 : now.getDay() - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - daysFromMonday);
      return `${monday.getMonth() + 1}-${monday.getDate()}-${String(monday.getFullYear()).slice(2)}`;
    }

    function applyTheme(theme) {
      if (!theme) return;
      const root = document.documentElement;
      if (theme.bgGradient) root.style.setProperty('--bg-gradient', theme.bgGradient);
      if (theme.primaryRgb) root.style.setProperty('--primary-rgb', theme.primaryRgb);
      if (theme.accentRgb) root.style.setProperty('--accent-rgb', theme.accentRgb);
      if (theme.checkedRgb) root.style.setProperty('--checked-rgb', theme.checkedRgb);
    }

    async function loadContent(week) {
      const storageKey = `checkedItems-${week}`;

      const lastWeek = localStorage.getItem('lastWeek');
      if (lastWeek && lastWeek !== week) {
        localStorage.removeItem(`checkedItems-${lastWeek}`);
      }
      localStorage.setItem('lastWeek', week);

      checkedItems = JSON.parse(localStorage.getItem(storageKey) || '{}');

      const [groceryRes, recipeRes] = await Promise.all([
        fetch(`content/${week}/grocery.json`),
        fetch(`content/${week}/recipe.md`),
      ]);

      const groceryData = await groceryRes.json();
      const recipeMarkdown = await recipeRes.text();

      groceryCategories = groceryData.categories;
      currentWeek = week;

      applyTheme(groceryData.theme);

      document.title = groceryData.meta.title;
      document.getElementById('week-label').textContent = groceryData.meta.weekLabel;
      document.getElementById('meal-subtitle').textContent = groceryData.meta.title;

      renderGroceryList();
      updateProgress();

      document.getElementById('recipe-content').innerHTML = marked.parse(recipeMarkdown);
    }

    function renderGroceryList() {
      const container = document.getElementById('grocery-list');
      container.innerHTML = '';

      groceryCategories.forEach(category => {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'category';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'category-header';

        const emojiSpan = document.createElement('span');
        emojiSpan.className = 'category-emoji';
        emojiSpan.textContent = category.emoji;
        headerDiv.appendChild(emojiSpan);

        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = category.category;
        headerDiv.appendChild(title);

        categoryDiv.appendChild(headerDiv);

        category.items.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'grocery-item';
          if (checkedItems[item.id]) itemDiv.classList.add('checked');
          itemDiv.onclick = () => toggleItem(item.id);

          const noteHtml = item.note
            ? `<div class="item-note">${item.note}</div>`
            : '';

          itemDiv.innerHTML = `
            <div class="item-left">
              <div class="checkbox">
                <span class="checkmark">✓</span>
              </div>
              <div>
                <div class="item-name">${item.name}</div>
                ${noteHtml}
              </div>
            </div>
            <div class="quantity-badge">${item.qty}</div>
          `;

          categoryDiv.appendChild(itemDiv);
        });

        container.appendChild(categoryDiv);
      });
    }

    function toggleItem(id) {
      checkedItems[id] = !checkedItems[id];
      localStorage.setItem(`checkedItems-${currentWeek}`, JSON.stringify(checkedItems));
      renderGroceryList();
      updateProgress();
    }

    function updateProgress() {
      const totalItems = groceryCategories.reduce((sum, cat) => sum + cat.items.length, 0);
      const checkedCount = Object.values(checkedItems).filter(Boolean).length;
      const progress = totalItems > 0 ? Math.round((checkedCount / totalItems) * 100) : 0;

      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('progress-count').textContent = `${checkedCount} of ${totalItems} items collected`;
    }

    function showSection(section, btn) {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      document.getElementById(section + '-section').classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let wakeLock = null;
    let noSleepVideo = null;

    // Fallback for browsers that don't expose navigator.wakeLock (e.g. Chrome
    // and other third-party browsers on iOS, which all run on WebKit but
    // don't get the Wake Lock API like Safari does). A muted video sourced
    // from a canvas stream, looping forever, keeps the screen awake on iOS
    // regardless of which browser is used.
    function enableNoSleepVideo() {
      if (noSleepVideo) {
        noSleepVideo.play().catch(() => {});
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      ctx.fillRect(0, 0, 1, 1);

      if (typeof canvas.captureStream !== 'function') return;
      const stream = canvas.captureStream(1);

      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.muted = true;
      video.loop = true;
      video.style.position = 'fixed';
      video.style.top = '0';
      video.style.left = '0';
      video.style.width = '1px';
      video.style.height = '1px';
      video.style.opacity = '0';
      video.style.pointerEvents = 'none';

      video.srcObject = stream;
      document.body.appendChild(video);
      video.play().catch(() => {});
      noSleepVideo = video;
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          return;
        } catch (e) {
          // fall through to video fallback
        }
      }
      enableNoSleepVideo();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // iOS requires a user gesture before granting a wake lock or allowing
    // video playback, so acquire it on first tap rather than on page load.
    function acquireWakeLockOnFirstInteraction() {
      requestWakeLock();
      document.removeEventListener('click', acquireWakeLockOnFirstInteraction);
      document.removeEventListener('touchstart', acquireWakeLockOnFirstInteraction);
    }
    document.addEventListener('click', acquireWakeLockOnFirstInteraction);
    document.addEventListener('touchstart', acquireWakeLockOnFirstInteraction);

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const week = resolveWeek();
        await loadContent(week);
      } catch (err) {
        document.getElementById('grocery-list').innerHTML =
          '<p style="color:rgba(245,225,180,0.4);text-align:center;padding:40px 0;">Unable to load week content.</p>';
        document.getElementById('recipe-content').innerHTML =
          '<p style="color:rgba(245,225,180,0.4);text-align:center;padding:40px 0;">Unable to load week content.</p>';
      }
    });
  </script>
</body>
</html>
